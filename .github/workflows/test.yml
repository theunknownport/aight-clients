# All four suites, on every push and pull request.
#
# Four independent jobs rather than one, because the four packages are
# genuinely independent — each has its own toolchain and none imports another.
# A single job would report one green tick for four unrelated things, and a
# failure in Go would stop Python from being tested at all.
#
# The versions are the floors each manifest declares, rounded up to something
# still supported: requires-python >=3.11, engines.node >=18, `go 1.21`,
# maven.compiler.release 17.
name: test

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # [examples] is not optional here: tests/test_tracing.py imports
      # examples.langgraph_spike, which imports langgraph. Without the extra
      # the suite fails at collection rather than skipping.
      - run: pip install -e ".[dev,examples]"
      - run: pytest -q

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No `npm install`: the SDK has no runtime dependencies, and `npm test`
      # is `node --test`, so there is nothing to fetch.
      - run: npm test

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: mvn -B test
